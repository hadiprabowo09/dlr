<style>@media (display-mode:standalone){body{overscroll-behavior-y:contain}}#pwaInstall{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;display:none;align-items:center;gap:8px;padding:10px 14px;border:0;border-radius:999px;background:#f59e0b;color:#0b1f3a;font:700 14px/1 inherit;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}#pwaInstall.on{display:flex}#pwaInstall i{font-style:normal;opacity:.7;margin-left:4px;padding:0 4px}</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 44 44%27%3E%3Crect width=%2744%27 height=%2744%27 rx=%2711%27 fill=%27%230b1f3a%27/%3E%3Cpath d=%27M7 27C14 27 12 18 20 18S28 9 36 9%27 fill=%27none%27 stroke=%27%23f59e0b%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-dasharray=%271 5.5%27/%3E%3Ccircle cx=%2736%27 cy=%279%27 r=%274%27 fill=%27%23f59e0b%27/%3E%3Ctext x=%2722%27 y=%2739%27 text-anchor=%27middle%27 font-size=%2712%27 font-weight=%27800%27 fill=%27%23fff%27 font-family=%27sans-serif%27%3EDLR%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   DLR — Professional Sports Education (Sport Pro)
   Token warna: navy dasar · biru olahraga · aksen oranye-emas · hijau khusus status selesai
   Semua nama class lama dipertahankan agar JavaScript tidak terganggu.
   ========================================================== */
:root{
  --bg:#f2f5fa;--card:#ffffff;--card2:#f6f8fc;--tx:#0b1f3a;--mu:#51627a;
  --pr:#1658c9;--pb:#1b64d8;--pbh:#1553b8;--sel:#e7f0ff;
  --hd:#0b1f3a;--hd2:#12305a;--hero:#0b1f3a;
  --ac:#f59e0b;--ach:#ffb02e;--acs:#fff4d9;--acx:#5a3d00;
  --gr:#15803d;--grb:#16a34a;--grs:#e4f5ea;
  --rd:#b42318;--rds:#fdecea;
  --bd:#d5ddea;--fc:#1658c9;--tb:#0b1f3a;--tt:#ffffff;
  --fd:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --fb:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111f;--card:#0f1c32;--card2:#142540;--tx:#e8eefb;--mu:#9fb2cf;
  --pr:#6aaeff;--pb:#2563eb;--pbh:#1e50c9;--sel:#16315e;
  --hd:#060e1c;--hd2:#0e2243;--hero:#10284d;
  --ach:#ffc04d;--acs:#2b2208;--acx:#fde7b0;
  --gr:#4ade80;--grb:#22c55e;--grs:#0f2c1c;--rd:#ff8f86;--rds:#3a1613;
  --bd:#243a5c;--fc:#f5a524;--tb:#e8eefb;--tt:#0b1f3a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111f;--card:#0f1c32;--card2:#142540;--tx:#e8eefb;--mu:#9fb2cf;
  --pr:#6aaeff;--pb:#2563eb;--pbh:#1e50c9;--sel:#16315e;
  --hd:#060e1c;--hd2:#0e2243;--hero:#10284d;
  --ach:#ffc04d;--acs:#2b2208;--acx:#fde7b0;
  --gr:#4ade80;--grb:#22c55e;--grs:#0f2c1c;--rd:#ff8f86;--rds:#3a1613;
  --bd:#243a5c;--fc:#f5a524;--tb:#e8eefb;--tt:#0b1f3a;color-scheme:dark}

*{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--fb);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--fd);line-height:1.1;letter-spacing:.2px}
h2{font-size:clamp(30px,4.6vw,40px);font-weight:800;margin:18px 0 6px}
h3{font-size:23px;font-weight:700;margin:0 0 10px}
p{margin:.6em 0}
a{color:var(--pr)}
ol,ul{padding-left:1.3em}li{margin:.25em 0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.24em}
.ico{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:-.22em;fill:currentColor}
:focus-visible{outline:3px solid var(--fc);outline-offset:2px}

/* ---------- Header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hd);color:#fff;border-bottom:3px solid var(--ac)}
header :focus-visible{outline-color:var(--ac)}
.hr1{display:flex;align-items:center;gap:10px;max-width:1040px;margin:0 auto;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.lg{flex:none}
.lgt{display:flex;flex-direction:column;line-height:1}
.lgt b{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:1px;color:#fff}
.lgt small{font-size:10.5px;color:#a9bddf;font-weight:600;margin-top:2px;white-space:nowrap}
.sp{flex:1}
#dt{font-size:13px;font-weight:600;color:#a9bddf;white-space:nowrap}
#sy{font-size:12px;color:#ffd88a}
#burger{display:none}
nav{display:flex;flex-wrap:wrap;gap:0;background:var(--hd2);padding:0 max(16px,calc((100% - 1008px)/2))}
nav a{position:relative;padding:11px 14px;cursor:pointer;color:#b9cae6;font-weight:600;font-size:14px;white-space:nowrap}
nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
nav a.on{color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 0 -3px 0 var(--ac)}

/* ---------- Tombol ---------- */
button,.btn{font:inherit;font-weight:700;font-size:15px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid transparent;border-radius:8px;cursor:pointer;background:var(--pb);color:#fff;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
button:hover,.btn:hover{background:var(--pbh)}
button.sec{background:var(--card);color:var(--tx);border-color:var(--bd)}
button.sec:hover{background:var(--card2);border-color:var(--pr)}
button.ac{background:var(--ac);color:#1a1200}
button.ac:hover{background:var(--ach)}
button:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{background:var(--pb)}button.sec:disabled:hover{background:var(--card);border-color:var(--bd)}
header button,header .btn{min-height:38px;padding:6px 14px;font-size:14px}
header button.sec,header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
header button.sec:hover,header .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.55)}
header button.ac{background:var(--ac);color:#1a1200;border-color:var(--ac)}
header button.ac:hover{background:var(--ach)}
#hb{text-decoration:none;color:#fff}
#theme{padding:6px 10px}
#burger{padding:6px 10px}

/* ---------- Profil ---------- */
#pf{position:relative}
.pfc{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 14px 3px 3px;border-radius:99px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.28)}
.pfc:hover{background:rgba(255,255,255,.14)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#1a1200;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.pfn{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}
.pfx{font-size:12px;color:#c4d3ee;font-weight:600;white-space:nowrap}
.pfm{position:absolute;right:0;top:calc(100% + 10px);width:260px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:8px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:60}
.pfm[hidden]{display:none}.pfm p{margin:4px 0;font-size:14px}
header .pfm button{width:100%;margin-top:10px;min-height:42px}
header .pfm button.sec{background:var(--card);color:var(--tx);border-color:var(--bd)}
header .pfm button.sec:hover{background:var(--card2);border-color:var(--pr)}

/* ---------- Layout ---------- */
main{max-width:1040px;margin:0 auto;padding:24px 16px 56px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;margin:14px 0}
.card .card{background:var(--card2);padding:14px;margin:10px 0}
.card>h3:first-child,.card>.ch:first-child h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid>.card{margin:0}
.mu{color:var(--mu);font-size:14px}
.sm{font-size:12.5px}
.ok{color:var(--gr)}
.okc{color:var(--gr)}.bdc{color:var(--rd)}
.sc{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--bd);color:var(--mu);white-space:normal}
.chip{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.c-Selesai{color:var(--gr);background:var(--grs);border-color:transparent}
.c-Remedial{color:var(--rd);background:var(--rds);border-color:transparent}
.c-Sedang{color:var(--pr);background:var(--sel);border-color:transparent}
.stat{font-family:var(--fd);font-size:46px;font-weight:800;line-height:1;color:var(--pr);font-variant-numeric:tabular-nums;margin-bottom:4px}
.warn{background:var(--acs);color:var(--acx);border-left:6px solid var(--ac);padding:12px 14px;border-radius:6px;margin:14px 0}
.warn.card{border:0;border-left:6px solid var(--ac)}
.warn b{color:inherit}
.warn a{color:inherit;font-weight:700}
.warn .ic{margin-right:2px}

/* ---------- Progress ---------- */
.bar{display:block;height:10px;background:var(--card2);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:0 5px 5px 0;transition:width .6s}
.bar.ok i{background:var(--grb)}
.hbar{height:14px;border-radius:3px;background:var(--pb);margin:3px 0}

/* ---------- Form ---------- */
label{display:block;font-weight:700;font-size:14px}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(27,100,216,.25)}
input[aria-invalid=true]{border-color:var(--rd)}
select{width:auto;padding:9px 12px;margin:0}
.grid select,.grid input{width:100%;margin:0}
input[type=checkbox]{width:22px;height:22px;padding:0;margin:0;accent-color:var(--pb);flex:none}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0;font-weight:500;font-size:15px}
.fi{display:block;position:relative;margin:4px 0 12px}
.fi input{margin:0;padding-left:44px}
.fi i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);display:flex;font-style:normal;pointer-events:none}

/* ---------- Beranda / hero ---------- */
.hero2{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:10px;border-bottom:5px solid var(--ac);padding:46px 32px 36px}
.hero2>*:not(.court){position:relative;z-index:1}
.hero2 .court{position:absolute;right:-30px;top:50%;transform:translateY(-50%);height:118%;width:auto;color:#7fb3ff;opacity:.2;pointer-events:none}
.eyebrow{color:var(--ac);font-weight:700;font-size:13px;letter-spacing:.8px}
.hero2 h1{font-size:clamp(34px,8.2vw,76px);font-weight:800;line-height:.98;margin:10px 0 16px;max-width:11em;text-transform:none;overflow-wrap:break-word}
.hero2 p{color:#d3e1f8;max-width:560px;margin:0 0 6px}
.hs{display:flex;max-width:460px;margin:24px 0;border:1px solid rgba(255,255,255,.28);border-radius:8px;overflow:hidden}
.hs div{flex:1;min-width:0;padding:12px 8px;text-align:center;font-size:13px;color:#c9d9f3;border-left:1px solid rgba(255,255,255,.28)}
.hs div:first-child{border-left:0}
.hs b{display:block;font-family:var(--fd);font-size:36px;line-height:1;color:#fff;margin-bottom:2px}
.cta{background:var(--ac);color:#1a1200;font-size:17px;min-height:52px;padding:12px 28px;border-radius:8px}
.cta:hover{background:var(--ach)}
.cta:active{transform:scale(.98)}
.hero2 p.tagline{margin:18px 0 0;font-size:13px;color:#a9bddf;font-weight:600}
.stp{list-style:none;margin:16px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.stp li{display:flex;flex-direction:column;gap:8px;margin:0;padding:14px;background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--pb);border-radius:8px;font-size:14px}
.stp .si{color:var(--pr);display:flex}
.stp .si .ic{width:26px;height:26px}
.no{width:30px;height:30px;border-radius:6px;background:var(--hd);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:19px;font-weight:800}
.hgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start;margin-top:16px}
.hgrid>*{margin:0!important}
.lgw{padding:0;background:none}
.glass{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--pb);border-radius:10px;padding:22px}
.glass h2{margin-top:0}

/* ---------- Jenjang ---------- */
.jj{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.jc{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%;min-height:190px;text-align:left;border-radius:10px;padding:22px;color:#fff;border:0;font-weight:500}
.jc:hover{filter:brightness(1.1)}
.jc .jn{position:absolute;right:12px;bottom:-18px;font-family:var(--fd);font-style:normal;font-size:128px;font-weight:800;line-height:1;opacity:.12;pointer-events:none}
.jc b{display:block;font-family:var(--fd);font-size:34px;font-weight:800;line-height:1;letter-spacing:.5px;position:relative}
.jc strong{display:block;margin:6px 0 8px;font-size:14px;letter-spacing:.6px;position:relative}
.jc span{font-weight:500;font-size:14px;position:relative}
.j-X{background:#1b64d8}.j-XI{background:#12305a}.j-XII{background:#a8480a}
.jd{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.jd.j-X{background:#1b64d8}.jd.j-XI{background:#12305a}.jd.j-XII{background:#a8480a}
:root[data-theme="dark"] .jd.j-XI{background:#6aaeff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .jd.j-XI{background:#6aaeff}}

/* ---------- Materi ---------- */
.ch{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.ch h3{margin:0;font-size:24px}
.ch .ci{width:42px;height:42px;border-radius:8px;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ch .ci .ic{width:24px;height:24px}
.mg{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.mc{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;text-align:left;min-height:96px;padding:12px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:5px solid var(--pb);border-radius:8px;font-weight:700}
.mc:hover{background:var(--card2);border-color:var(--pb)}
.mc.fin{border-left-color:var(--grb)}
.mc.off{border-left-color:var(--bd);color:var(--mu);background:var(--card2)}
.mc .mt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:16px}
.mc .mt .ic{color:var(--pr)}.mc.fin .mt .ic{color:var(--gr)}.mc.off .mt .ic{color:var(--mu)}
.mc .ms{font-size:12.5px;font-weight:600;color:var(--mu)}
.mc .bar{margin:2px 0 0;height:8px}

/* ---------- Roadmap ---------- */
.lp{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.lp div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card2)}
.step{display:flex;align-items:center;gap:14px;margin:10px 0;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:8px}
.step .sn{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:20px;font-weight:800;color:var(--mu);border:2px solid var(--bd);background:var(--card)}
.step .si{flex:none;color:var(--pr);display:flex}
.step .si .ic{width:26px;height:26px}
.step .stx{flex:1;min-width:0;display:flex;flex-direction:column}
.step .stx b{font-size:16px}
.step .stx .sm{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.step.done{border-left-color:var(--grb)}
.step.done .sn{background:var(--grb);border-color:var(--grb);color:#fff}
.step.cur{border-left-color:var(--ac);background:var(--acs)}
.step.cur .sn{background:var(--ac);border-color:var(--ac);color:#1a1200}
.step.lock{opacity:.6}
.step.lock .si{color:var(--mu)}
.step b{color:var(--tx)}
.step.cur .mu{color:var(--acx)}
.step button{min-height:40px;padding:8px 16px}

/* ---------- Soal & instruksi ---------- */
.goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:5px solid var(--pb)}
.qc{padding:18px}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.qh b{flex:1;font-size:16.5px;line-height:1.45;padding-top:4px}
.qn{flex:none;width:36px;height:36px;border-radius:6px;background:var(--hd);color:#fff;font-family:var(--fd);font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center}
.qc.ans .qn{background:var(--pb)}
.qh .tag{margin-top:6px;white-space:nowrap}
.opt{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;min-height:50px;margin:8px 0 0;text-align:left;font-weight:600;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);padding:10px 14px}
.opt:hover{background:var(--card2);border-color:var(--pb)}
.opt .ol{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--mu)}
.opt.sel{background:var(--sel);border-color:var(--pb);color:var(--tx)}
.opt.sel .ol{background:var(--pb);border-color:var(--pb);color:#fff}
.opt[style*="inline-block"]{margin:4px 6px 4px 0}
.qbar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:8px}
.qbar .qcnt{font-size:14px;font-weight:600;white-space:nowrap}
.qbar .bar{flex:1;min-width:80px;margin:0}
.rv{border-left:5px solid var(--bd)}
.rv.ok{border-left-color:var(--grb);color:var(--tx)}
.rv.bad{border-left-color:var(--rd)}
.rsum{font-weight:700}
.ins{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.ins .ii{flex:none;width:36px;height:36px;border-radius:8px;background:var(--sel);color:var(--pr);display:flex;align-items:center;justify-content:center}
.ins>div{flex:1;min-width:0;padding-top:6px}
textarea{resize:vertical;min-height:110px}
.card>.chk{margin:10px 0}

/* ---------- Achievement ---------- */
.bdg{text-align:center}
.bdg .bi{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#1a1200}
.bdg .bi .ic{width:28px;height:28px}
.bdg.off{opacity:.4}.bdg.off .bi{background:var(--card2);color:var(--mu);border:1px dashed var(--bd)}

/* ---------- Tabel & dashboard guru ---------- */

/* ---------- Modal, toast, FAB ---------- */

.confirm-box h3{font-size:24px}

#pm>.card{border-top:5px solid var(--pb);box-shadow:0 18px 50px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;background:var(--tb);color:var(--tt);padding:12px 20px;border-radius:8px;display:none;z-index:110;font-weight:600;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
#fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#1a1200;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#fab:hover{background:var(--ach)}

/* ---------- Footer ---------- */
footer{background:var(--hd);color:#c4d3ee;border-top:4px solid var(--ac);margin-top:20px}
.ft{max-width:1040px;margin:0 auto;padding:32px 16px 20px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px 32px;align-items:start}
.ft-b{display:flex;flex-direction:column;gap:6px}
.ft-b .fb-n{font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:1px;color:#fff;line-height:1}

.ppgw{display:block;width:100%;aspect-ratio:800/292;overflow:hidden}

.ft-d{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.ig{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:8px 16px 8px 12px;border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;transition:background-color .2s,border-color .2s,color .2s}

const v25n=x=>{const n=parseFloat(x);return isFinite(n)?n:null};
const v25cat=g=>g>=0.7?["Tinggi","c-Selesai"]:g>=0.3?["Sedang",""]:["Rendah","c-Remedial"];
const v25f=g=>(Math.round(g*100)/100).toFixed(2).replace(".",",");
const v25m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function v25rows(R){const o=[];(R||[]).forEach(r=>{const a=v25n(r.pre),b=v25n(r.post);if(a==null||b==null||r.post===""||r.pre===""||a>=100)return;o.push({r,a,b,g:(b-a)/(100-a)})});return o}
function v25html(R){const K=v25rows(R),skip=(R||[]).length-K.length;
if(!K.length)return `<div class="card v25"><b>Analisis N-Gain</b><p class="mu">Belum ada data dengan Tes Awal dan Tes Ulang yang dapat dihitung.</p></div>`;
const c={Tinggi:0,Sedang:0,Rendah:0};K.forEach(k=>c[v25cat(k.g)[0]]++);
const by={};K.forEach(k=>{(by[k.r.materi]=by[k.r.materi]||[]).push(k)});
const rows=Object.keys(by).sort().map(m=>{const a=by[m],pa=v25m(a.map(k=>k.a)),pb=v25m(a.map(k=>k.b)),g=(pb-pa)/(100-pa),ct=v25cat(g);return `<tr><td>${esc(m)}</td><td>${a.length}</td><td>${Math.round(pa)}</td><td>${Math.round(pb)}</td><td>${v25f(g)}</td><td><span class="chip ${ct[1]}">${ct[0]}</span></td></tr>`}).join("");
const low=K.filter(k=>k.g<0.3||k.r.status==="Remedial").sort((x,y)=>x.g-y.g).slice(0,25);
const lr=low.map(k=>{const ct=v25cat(k.g);return `<tr><td>${esc(gv(k.r.nama))}</td><td>${esc(gv(k.r.kelas))}</td><td>${esc(gv(k.r.materi))}</td><td>${k.a}</td><td>${k.b}</td><td>${v25f(k.g)}</td><td><span class="chip ${ct[1]}">${ct[0]}</span></td></tr>`}).join("")||`<tr><td colspan="7">Tidak ada siswa pada kriteria ini.</td></tr>`;
return `<div class="card v25"><b>Analisis N-Gain (Tes Awal → Tes Ulang)</b><p class="mu">N-Gain = (Tes Ulang − Tes Awal) ÷ (100 − Tes Awal). Kategori mengikuti kriteria Hake: tinggi ≥ 0,70; sedang 0,30–0,69; rendah &lt; 0,30. Mengikuti filter di atas.</p>
<div class="grid"><div class="card"><div class="stat">${v25f(v25m(K.map(k=>k.g)))}</div><span class="mu">Rata² N-Gain individu (${K.length} data)</span></div><div class="card"><div class="stat">${c.Tinggi}</div><span class="mu">Kategori tinggi</span></div><div class="card"><div class="stat">${c.Sedang}</div><span class="mu">Kategori sedang</span></div><div class="card"><div class="stat">${c.Rendah}</div><span class="mu">Kategori rendah</span></div></div>
<h4>Per materi</h4><div class="sc"><table><tr><th>Materi</th><th>Jml data</th><th>Rata² Tes Awal</th><th>Rata² Tes Ulang</th><th>N-Gain</th><th>Kategori</th></tr>${rows}</table></div>
<h4>Perlu perhatian (N-Gain rendah atau status Remedial)</h4><div class="sc"><table><tr><th>Nama</th><th>Kelas</th><th>Materi</th><th>Tes Awal</th><th>Tes Ulang</th><th>N-Gain</th><th>Kategori</th></tr>${lr}</table></div>
${skip?`<p class="mu">${skip} baris tidak dihitung (belum ada Tes Awal/Tes Ulang, atau Tes Awal 100).</p>`:""}

const t="\ufeff"+[H.map(q).join(",")].concat(K.map(k=>[k.r.nama,k.r.sekolah,k.r.kelas,k.r.absen,k.r.materi,k.a,k.b,v25f(k.g),v25cat(k.g)[0]].map(q).join(","))).join("\r\n");

/* ===== v33: PEMBAHASAN RINGKAS untuk soal Kelas XI–XII yang belum punya pembahasan (soal bank v24 tidak diubah) ===== */
const V33P={"Sepak Bola":["Prinsip: kombinasikan umpan–kontrol–giring–tembak sambil membuka ruang, ambil keputusan sebelum menerima bola, dan utamakan keselamatan serta sportivitas.","Prinsip: tampil konsisten dan terukur (catat percobaan), pilih tindakan sesuai situasi permainan, patuhi aturan, dan utamakan keselamatan serta evaluasi diri."],
"Bola Basket":["Prinsip: dribble rendah dengan kepala tegak, operan tepat sasaran, bergerak mencari ruang, bertahan tanpa kontak kasar, dan menyelesaikan serangan dengan teknik benar.","Prinsip: rangkaian dribble–operan–tembakan/lay-up dinilai dari kontrol, akurasi, keputusan, kerja sama, dan keselamatan; hasil dicatat untuk evaluasi."],
"Nomor Lari":["Prinsip: start dan akselerasi terkontrol, ritme sesuai jarak, ayunan lengan efektif, pemanasan–pendinginan, hidrasi, dan pencatatan waktu yang konsisten.","Prinsip: tampil mandiri dan aman (pemanasan, prosedur start), teknik dan ritme konsisten, waktu dicatat apa adanya, lalu dievaluasi untuk perbaikan."],
"Lompat":["Prinsip: awalan konsisten dan terkendali, tolakan di papan dengan ayunan lengan, melayang seimbang, pendaratan lutut lentur, dan hasil diukur dari bekas terdekat.","Prinsip: periksa area, tolakan sah di papan, rangkaian konsisten, pendaratan aman, pengukuran dengan alat yang sama, lalu evaluasi."],
"Lempar":["Prinsip: tenaga mengalir dari kaki, pinggul, bahu, ke lengan; pelepasan terarah; area steril, satu arah lempar, dan tunggu aba-aba.","Prinsip: periksa alat dan area, rangkaian terkoordinasi, lemparan di dalam sektor, pengukuran yang sah, dan keselamatan selalu didahulukan."],
"Tolak":["Prinsip: alat didorong (bukan dilempar) dari bahu, urutan dorongan kaki–pinggul–lengan, tetap seimbang di dalam area, alat sesuai kemampuan, area steril.","Prinsip: tolakan berurutan dan seimbang di dalam area, hasil diukur dengan prosedur yang sama, alat disesuaikan kemampuan, keselamatan didahulukan."],
"Kekuatan":["Prinsip: teknik benar lebih penting daripada jumlah ulangan, tantangan naik bertahap, beri jeda pulih, atur napas, dan hentikan latihan bila nyeri.","Prinsip: program kekuatan disusun sesuai tujuan dan kemampuan (FITT), dicatat, dievaluasi, dan disesuaikan; kemajuan dibandingkan dengan diri sendiri."],
"Daya Tahan":["Prinsip: naikkan durasi bertahap, atur intensitas dengan talk test atau skala usaha, lakukan pemanasan–pendinginan, cukup minum, dan berhenti bila pusing atau sesak.","Prinsip: rencanakan dengan FITT, jaga intensitas terkendali, catat durasi dan respons tubuh, perhatikan pemulihan, dan evaluasi kemajuan pribadi."],
"Kecepatan":["Prinsip: reaksi dan akselerasi dilatih dengan jeda pulih cukup, tubuh rileks dengan ayunan lengan efektif, dan waktu dicatat dengan cara ukur yang sama.","Prinsip: tampil konsisten setelah pemanasan mandiri, jeda pulih menjaga kualitas gerak, waktu dicatat dan dianalisis, teknik tetap dinilai."],
"Senam Irama":["Prinsip: gerak selaras ketukan dan hitungan, perpindahan lancar, variasi arah–level–tempo, kekompakan, dan ruang gerak yang aman.","Prinsip: rangkaian berstruktur (awal–inti–transisi–akhir) tampil selaras irama dan berkesinambungan, dengan ekspresi wajar dan ruang gerak yang aman."],
"Roll Depan":["Prinsip: dagu ke dada, punggung membulat, kepala tidak menjadi tumpuan, dilakukan di atas matras dengan pengawasan, dan tahapan lebih mudah bagi yang belum siap.","Prinsip: tampil terkontrol dan aman (matras, pengawasan, kesiapan leher) dengan posisi akhir stabil; yang belum siap memakai modifikasi yang tetap menilai tujuan."],
"Roll Belakang":["Prinsip: punggung membulat, tangan di dekat bahu mendorong agar kepala terlindungi, tanpa menekan leher, dengan matras, pendamping, dan tahapan bertahap.","Prinsip: dorongan tangan dan kontrol akhir dinilai bersama keselamatan leher; modifikasi tersedia bagi yang belum siap tanpa mengurangi tujuan penilaian."],
"Kayang":["Prinsip: kesiapan kelenturan bahu–punggung dan kekuatan lengan dibangun bertahap, tanpa dihentak atau dipaksa, dengan matras dan pendamping.","Prinsip: tampil sesuai kesiapan dengan kontrol dan keselamatan; alternatif yang adil tersedia bagi yang belum siap, dan nyeri tajam berarti berhenti."],
"Sikap Lilin":["Prinsip: beban bertumpu pada bahu dan lengan atas (bukan leher), garis tubuh lurus dengan topangan tangan, naik dan turun terkendali di atas matras.","Prinsip: stabil dan terkontrol dengan leher aman; durasi ditetapkan guru; modifikasi (tungkai lebih rendah atau dinding) tersedia bagi yang belum siap."],
"Meroda":["Prinsip: tangan bergantian segaris dengan lengan lurus, tungkai terbuka, pendaratan terkontrol, garis panduan, matras, dan pendamping saat belajar.","Prinsip: urutan tumpuan dan arah konsisten dengan pendaratan terkontrol; modifikasi tersedia bagi yang belum siap, dan keselamatan selalu dinilai."],
"Bulutangkis":["Prinsip: posisi siap dan footwork menjangkau kok lalu kembali ke tengah, variasi pukulan dipilih sesuai posisi lawan, grip rileks, dan aturan servis dipatuhi.","Prinsip: servis sah dan variasi pukulan konsisten, strategi menyesuaikan lawan, komunikasi di ganda, sportivitas, dan keselamatan (jarak aman)."],
"Rounders":["Prinsip: pukulan terarah dengan rotasi tubuh, lempar–tangkap terkoordinasi, keputusan lari berdasar posisi bola dan penjaga, komunikasi regu, dan jalur aman.","Prinsip: keterampilan individu terkontrol dan strategi regu (menyerang–bertahan) dengan keputusan beralasan, komunikasi, sportivitas, dan keselamatan."]};

/* ===== v14: ANDROID / PWA (tambahan; kode lama tidak diubah) ===== */
(function(){
  /* 1. Service worker: aplikasi bisa dibuka tanpa internet setelah pernah dibuka sekali */
  try{
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
      addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
    }
  }catch(e){}

  /* 2. Tombol Back Android: kembali ke layar sebelumnya, bukan keluar dari aplikasi */
  try{
    if(typeof go==='function' && window.history && history.pushState){
      var asli=go, pop=false;
      var kunci=function(){return V+(V==='stage'?':'+stage:'')};
      var terakhir=kunci();
      history.replaceState({dlr:1,v:V,st:stage},'');
      window.go=function(){
        var r=asli.apply(this,arguments);
        var k=kunci();
        if(!pop && k!==terakhir) history.pushState({dlr:1,v:V,st:stage},'');
        terakhir=k;
        return r;
      };
      addEventListener('popstate',function(e){
        var s=e.state; if(!s||!s.dlr) return;
        pop=true;
        try{asli(s.v==='stage'?s.st:s.v)}catch(x){}
        pop=false; terakhir=kunci();
      });
    }
  }catch(e){}

  /* 3. Saat aplikasi dibuka lagi dari latar belakang / koneksi kembali: kirim data tertunda */
  try{
    document.addEventListener('visibilitychange',function(){
      if(!document.hidden && typeof flush==='function'){try{flush()}catch(x){}}
    });
  }catch(e){}

  /* 4. Tombol "Pasang Aplikasi" (muncul otomatis di Chrome Android bila memenuhi syarat) */
  try{
    var tunda=null, DK='dlr:pwa:tutup';
    var tombol=document.createElement('button');
    tombol.id='pwaInstall'; tombol.type='button';
    tombol.innerHTML='\uD83D\uDCF2 Pasang Aplikasi <i title="Tutup" aria-label="Tutup">\u2715</i>';
    document.body.appendChild(tombol);
    addEventListener('beforeinstallprompt',function(e){
      e.preventDefault(); tunda=e;
      var tutup=false; try{tutup=localStorage.getItem(DK)==='1'}catch(x){}
      if(!tutup) tombol.classList.add('on');
    });
    tombol.addEventListener('click',function(ev){
      if(ev.target&&ev.target.tagName==='I'){
        tombol.classList.remove('on'); try{localStorage.setItem(DK,'1')}catch(x){} return;
      }
      if(!tunda) return;
      tunda.prompt();
      tunda.userChoice.then(function(){tunda=null;tombol.classList.remove('on')}).catch(function(){});
    });
    addEventListener('appinstalled',function(){tunda=null;tombol.classList.remove('on')});
  }catch(e){}
})();
